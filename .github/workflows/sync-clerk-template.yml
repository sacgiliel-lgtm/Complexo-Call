name: Sync Clerk email template

on:
  push:
    branches:
      - feature/clerk-auth-migration
    paths:
      - 'emails/clerk/invitation.html'
      - 'scripts/sync-clerk-template.mjs'
      - '.github/workflows/sync-clerk-template.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync invitation template
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: node scripts/sync-clerk-template.mjs
