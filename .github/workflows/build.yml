name: Build verification

on:
  push:
    branches: ['main', 'fix/security-admin-production']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
